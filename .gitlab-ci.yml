image: docker:latest

variables:
  GOOGLE_TAG: eu.gcr.io/papers-kubernetes/acurast-typescript-sdk:$CI_COMMIT_SHA
  GOOGLE_TAG_LATEST: eu.gcr.io/papers-kubernetes/acurast-typescript-sdk:latest

stages:
  - build
  - test
  - publish

build:
  stage: build
  script:
    - docker build -t $GOOGLE_TAG .
  tags:
    - docker

test:
  stage: test
  before_script:
    - docker rm -f unit-$CI_COMMIT_SHA || true
  script:
    - docker run --name unit-$CI_COMMIT_SHA $GOOGLE_TAG /bin/bash -c "yarn test:ci"
  after_script:
    - docker rm -f unit-$CI_COMMIT_SHA || true
  tags:
    - docker

format:
  stage: test
  before_script:
    - docker rm -f format-$CI_COMMIT_SHA || true
  script:
    - docker run --name format-$CI_COMMIT_SHA $GOOGLE_TAG /bin/bash -c "yarn format:check"
  after_script:
    - docker rm -f format-$CI_COMMIT_SHA || true
  tags:
    - docker

verify_tunnel_cid:
  stage: test
  before_script:
    - docker rm -f tunnel-cid-$CI_COMMIT_SHA || true
  script:
    - docker run --name tunnel-cid-$CI_COMMIT_SHA $GOOGLE_TAG /bin/bash -c "yarn --cwd packages/acurast-vps verify-tunnel-cid"
  after_script:
    - docker rm -f tunnel-cid-$CI_COMMIT_SHA || true
  tags:
    - docker

# Publish jobs only use the image built by this pipeline on this runner
# (--pull=never): a missing image fails the job instead of pulling one from the
# registry and handing it the npm token. NPM_AUTH_TOKEN must be a protected,
# masked variable so unprotected branches never receive it.
publish_beta:
  stage: publish
  rules:
    - if: $CI_COMMIT_REF_PROTECTED == "true"
      when: manual
      allow_failure: true
  before_script:
    - docker rm -f publish-$CI_COMMIT_SHA || true
  script:
    - docker run --rm --pull=never --env NPM_AUTH_TOKEN --name publish-$CI_COMMIT_SHA $GOOGLE_TAG ./npm-ci-publish-beta-only.sh
  after_script:
    - docker rm -f publish-$CI_COMMIT_SHA || true
  tags:
    - docker

publish:
  stage: publish
  only:
    - main
  when: manual
  before_script:
    - docker rm -f publish-$CI_COMMIT_SHA || true
  script:
    - docker run --rm --pull=never --env NPM_AUTH_TOKEN --name publish-$CI_COMMIT_SHA $GOOGLE_TAG ./npm-ci-publish.sh
  after_script:
    - docker rm -f publish-$CI_COMMIT_SHA || true
  tags:
    - docker
